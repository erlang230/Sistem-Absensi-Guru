name: CI - Sistem Absensi Guru

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  php-check:
    name: Cek Syntax PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Cek PHP
        run: |
          find . -name "*.php" \
          -not -path "./uploads/*" \
          -not -path "./chatbot-backend/node_modules/*" \
          -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

  node-check:
    name: Cek Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependency
        working-directory: chatbot-backend
        run: npm ci

      - name: Jalankan test
        working-directory: chatbot-backend
        run: npm test --if-present
